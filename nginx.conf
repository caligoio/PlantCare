server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Teruskan permintaan API ke service backend (Docker Compose).
  # Alamat diselesaikan saat ada request (bukan saat Nginx start), jadi image frontend
  # tetap bisa dijalankan sendirian tanpa backend.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Semua rute lain dikembalikan ke index.html, lalu ditangani React Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
